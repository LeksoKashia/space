<space-dialog-confirm></space-dialog-confirm>
<space-add-edit-client
  [visible]="showDialog"
  [client]="client()"
  [action]="clientAction()"
  (changeVisibility)="onCancel()"
></space-add-edit-client>

<p-table
  #dt
  [value]="clients"
  [paginator]="true"
  [rows]="5"
  [rowsPerPageOptions]="[5, 10, 20]"
  [sortMode]="'multiple'"
  [globalFilterFields]="globalFilterFields"
>
  <ng-template pTemplate="header">
    <tr>
      @for(column of mainColumns; track column){
      <th pSortableColumn="{{ column.field }}">
        {{ column.header }}
        <p-sortIcon [field]="column.field"></p-sortIcon>
      </th>
      }
      <th>Legal Address</th>
      <th>Actual Address</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-client>
    <tr>
      <td>{{ client.firstname }}</td>
      <td>{{ client.lastname }}</td>
      <td>{{ client.gender }}</td>
      <td>{{ client.idNumber }}</td>
      <td>{{ client.mobile }}</td>
      <td>
        {{ client.legalAddress | address }}
      </td>
      <td>
        {{ client.actualAddress | address }}
      </td>
      <td>
        <div class="flex">
          <p-button
            icon="pi pi-user-edit"
            (click)="editClient(client.id, client)"
            severity="secondary"
            pTooltip="edit"
            tooltipPosition="right"
            rounded
            text
          ></p-button>

          <p-button
            (click)="deleteClient($event, client.id)"
            icon="pi pi-trash"
            severity="secondary"
            pTooltip="delete"
            tooltipPosition="right"
            rounded
            text
          ></p-button>

          <p-button
            (click)="deleteClient($event, client.id)"
            icon="pi pi-user"
            severity="secondary"
            pTooltip="delete"
            tooltipPosition="right"
            rounded
            text
          ></p-button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
