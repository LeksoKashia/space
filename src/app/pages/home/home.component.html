<div class="main">
  @if (store.isLoading()) {
  <div class="spinner-container">
    <p-progress-spinner
      strokeWidth="8"
      fill="transparent"
      animationDuration=".5s"
      [style]="{ width: '50px', height: '50px' }"
    />
  </div>
  } @else {
  <div class="clients">
    <space-advanced-filter></space-advanced-filter>
    <space-client-list [clients]="store.clients()"></space-client-list>
  </div>
  }
</div>
